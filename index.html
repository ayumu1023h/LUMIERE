<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMIERE | Hair Salon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>LUMIERE</h1>

        <nav>
            <ul>
                <li><a href="#home">HOME</a></li>
                <li><a href="#concept">CONCEPT</a></li>
                <li><a href="#menu">MENU</a></li>
                <li><a href="#access">ACCESS</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">

            <img src="images/hero.png" alt="LUMIEREの写真">

            <div class="hero-text">
            <h2>あなたらしい、美しさを。</h2>
            <p>一人ひとりに寄り添う、あなただけのヘアスタイルを。</p>
            </div>
            
        </section>

        <section class="concept" id="concept">
            <h2>CONCEPT</h2>

            <div class="concept-content">

                <img src="images/salon.png" alt="美容室イメージ画像">

            
            <div class="concept-text">
            <p>髪を整えるだけではなく、毎日がすこし前向きになる。</p>
            <p>そんな時間とスタイルをお届けします。</p>
            </div>
            </div>
        </section>

        <section class="menu" id="menu">
            <h2>MENU</h2>

            <div class="menu-list">

                <div class="menu-item">
                    <img src="images/cut.JPG" alt="CUT">
                <h3>CUT</h3>
                <p>￥5,000</p>
                </div>

                <div class="menu-item">
                    <img src="images/color.JPG" alt="COLOR">
                    <h3>COLOR</h3>
                    <p>￥7000～</p>
                </div>

                <div class="menu-item">
                    <img src="images/perm.JPG" alt="PERM">
                    <h3>PERM</h3>
                    <p>￥8000～</p>
                </div>
            </div>

        </section>

        <section class="access" id="access">
            <h2>ACCESS</h2>

            <div class="access-info">
            <p>〒343-0000 埼玉県越谷市4-25-1</p>
            <p>営業時間：10:00~19:00</p>
            <p>定休日：火曜日</p>
            </div>
        </section>
    </main>

    <footer>
        <p>©　2026 LUMIERE Hair Salon</p>
    </footer>

</body>
</html>
